<!DOCTYPE html>
<html>
  <head>
    <title>Test A-Frame AR.js</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <!-- Nueva librería AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;" vr-mode-ui="enabled: false">
      
      <!-- 📌 Objeto fijo en el centro de la cámara -->
      <a-box position="0 0 -1" color="red" depth="0.5" height="0.5" width="0.5"></a-box>

      <!-- 📌 Objeto en marcador hiro -->
      <a-marker preset="hiro">
        <a-box position="0 0.5 0" color="blue"></a-box>
      </a-marker>

      <!-- Cámara -->
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
