<!DOCTYPE html>
<html>
  <head>
    <title>Test A-Frame AR.js</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.rawgit.com/jeromeetienne/AR.js/2.2.1/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin:0; overflow:hidden;">

    <!-- Escena con AR.js -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: true;">

      <!-- 📌 (1) Objeto libre en la escena, debería aparecer siempre -->
      <a-box position="0 1 -3" color="red" depth="1" height="1" width="1"></a-box>

      <!-- 📌 (2) Objeto con marcador preset "hiro" -->
      <a-marker preset="hiro">
        <a-sphere position="0 0.5 0" radius="0.5" color="blue"></a-sphere>
      </a-marker>

      <!-- 📌 (3) Objeto con marcador barcode (value=5) -->
      <a-marker type="barcode" value="5">
        <a-cylinder position="0 0.5 0" radius="0.3" height="1" color="green"></a-cylinder>
      </a-marker>

      <!-- Cámara AR -->
      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
